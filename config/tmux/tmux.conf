# Truecolor and focus events
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on

set -g history-limit 20000

# automatically renumber tmux windows
set -g renumber-windows on

# unbind default prefix and set it to Ctrl+a
unbind C-b
set -g prefix C-a

# for nested tmux sessions
bind a send-prefix

# Activity Monitoring
setw -g monitor-activity off
set -g visual-activity off

# Constrain window size to the largest client looking at *that window*
setw -g aggressive-resize on

# make delay shorter
set -sg escape-time 10

# tile all windows
bind = select-layout tiled

# cycle through panes
bind C-a select-pane -t :.+

# make window/pane index start with 1
set -g base-index 1
setw -g pane-base-index 1

set -g set-titles on
set -g set-titles-string "#T - #W"
setw -g automatic-rename off

######################
#### Key Bindings ####
######################

# reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

# quickly open a new window
bind N new-window -c "#{pane_current_path}"

# split window in the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# synchronize all panes in a window
bind u setw synchronize-panes

# pane movement shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resize pane shortcuts
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# maximizing and restoring windows
bind Up resize-pane -Z
bind Down resize-pane -Z

# enable mouse support for switching panes/windows
set -g mouse on

# set vi mode for copy mode
setw -g mode-keys vi
set -s copy-command "wl-copy"
bind Escape copy-mode
bind p paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

run-shell -b 'f=~/.local/share/tmux/plugins/tmux-which-key/plugin.sh.tmux; [ -f "$f" ] && "$f"'

##############################
### Color & Style Settings ###
##############################
# Catppuccin Frappe
tm_icon="☴"
tm_color_active="#8caaee"
tm_color_inactive="#737994"
tm_color_feature="#f4b8e4"

set -g status-left-length 32
set -g status-right-length 150
set -g status-interval 5

set -g status-style "fg=$tm_color_active,bg=default"

set -g window-status-style "fg=$tm_color_inactive,bg=default"
set -g window-status-format "#I #W"
set -g window-status-current-style "fg=$tm_color_active,bg=default"
set -g window-status-current-format "#[bold]#I #W"

set -g pane-border-style "fg=$tm_color_inactive"
set -g pane-active-border-style "fg=$tm_color_active"
set -g message-style "fg=$tm_color_active,bg=default"
set -g display-panes-active-colour "$tm_color_active"
set -g display-panes-colour "$tm_color_inactive"
setw -g clock-mode-colour "$tm_color_active"

set -g status-left "#[fg=$tm_color_feature,bold]$tm_icon #S "
set -g status-right "#[fg=$tm_color_inactive] %R %d %b #[fg=$tm_color_feature,bold]#h"
